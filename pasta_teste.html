  <form id="form-cadastro">
    <input id="nome" type="text" placeholder="Nome" required>
    <br><br>

    <input id="email" type="email" placeholder="E-mail" required>
    <br><br>

    <input id="senha" type="password" placeholder="Senha" minlength="6" required>
    <br><br>

    <button type="submit">Cadastrar</button>
  </form>

  <p id="mensagem"></p>

 <script>
  const formulario = document.getElementById("form-cadastro");
  const mensagem = document.getElementById("mensagem");

  formulario.addEventListener("submit", async (evento) => {
    evento.preventDefault();

    mensagem.style.color = "black";
    mensagem.textContent = "Enviando cadastro...";

    try {
      const resposta = await fetch("/api/cadastro", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          nome: document.getElementById("nome").value,
          email: document.getElementById("email").value,
          senha: document.getElementById("senha").value
        })
      });

      const dados = await resposta.json();

      if (resposta.ok) {
        mensagem.style.color = "green";
        mensagem.textContent = dados.mensagem;
        formulario.reset();
      } else {
        mensagem.style.color = "red";
        mensagem.textContent = dados.erro || "Não foi possível cadastrar.";
      }

    } catch (erro) {
      console.error(erro);
      mensagem.style.color = "red";
      mensagem.textContent =
        "Não foi possível conectar ao servidor. Abra o site por http://127.0.0.1:5000.";
    }
  });
</script>
</body>
</html>
